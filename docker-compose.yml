# Local development infrastructure only. Application processes run on the host
# (npm run dev) for fast reloads; they are not containerized until deployment work.
name: documind

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env (copy .env.example)}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (copy .env.example)}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env (copy .env.example)}
    ports:
      # Bound to loopback so the database is never exposed on the local network.
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 10

  # Local AI model server, started only on request: `npm run ai:up` (profile "ai").
  # CPU inference; the model is downloaded once into the ollama-models volume.
  ollama:
    image: ollama/ollama:0.40.5
    profiles: ['ai']
    restart: unless-stopped
    ports:
      # Loopback only: the model server has no authentication.
      - '127.0.0.1:${OLLAMA_PORT:-11434}:11434'
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ['CMD', 'ollama', 'list']
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  postgres-data:
  ollama-models:
