# Render Blueprint for the API (docs/operations/deployment.md). Values marked
# sync: false are entered in the Render dashboard on first sync; never commit them.
services:
  - type: web
    name: documind-api
    runtime: docker
    plan: free
    # Keep it near the Supabase project's region. It cannot be changed after creation.
    region: singapore
    dockerfilePath: ./Dockerfile
    # Liveness, not readiness: restarting the process does not fix a database outage.
    healthCheckPath: /api/v1/health
    # Deploy only commits whose GitHub checks (ci.yml) passed.
    autoDeployTrigger: checksPass
    buildFilter:
      paths:
        - apps/api/**
        - packages/shared/**
        - Dockerfile
        - .dockerignore
        - .npmrc
        - package.json
        - package-lock.json
        - tsconfig.base.json
    envVars:
      - key: NODE_ENV
        value: production
      - key: LOG_FORMAT
        value: json
      - key: LOG_LEVEL
        value: log
      # The free plan has no background workers (ADR-009).
      - key: WORKER_IN_PROCESS
        value: 'true'
      - key: DATABASE_POOL_MAX
        value: '5'
      - key: STORAGE_DRIVER
        value: s3
      - key: S3_REGION
        value: auto
      - key: AI_PROVIDER
        value: cloudflare
      # Supabase session pooler (port 5432): Render has no IPv6, and the direct host is IPv6-only.
      # Must end in ?sslmode=verify-full&sslrootcert=/etc/secrets/supabase-ca.crt, with the CA
      # uploaded as a secret file (docs/operations/deployment.md, step 1).
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      # The Cloudflare Pages origin, for example https://documind.pages.dev
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: CLOUDFLARE_ACCOUNT_ID
        sync: false
      - key: CLOUDFLARE_AI_API_TOKEN
        sync: false
